/* ---------- Buttons & Formulare ---------- */

/* ---------- Sheets ---------- */
dialog { border: none; padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg); margin: 0 0 0 auto; width: min(580px, 100vw); height: 100dvh; max-height: 100dvh; max-width: 100vw; border-radius: 22px 0 0 22px; }

@keyframes spin { to { transform: rotate(360deg); } }
.md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin-bottom: 3px; } .md h4 { font: 600 16px var(--f-display); margin: 14px 0 6px; } .md > :last-child { margin-bottom: 0; }
.score { font: 500 40px/1 var(--f-display); letter-spacing: -.03em; }
ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin-bottom: 4px; }
.note { font-size: 13px; color: var(--muted); }
.banner { display: flex; gap: 12px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); padding: 12px 16px; border-radius: 12px; margin-bottom: 22px; font-size: 14px; }

/* ---------- Chat ---------- */
.chat { display: flex; flex-direction: column; height: calc(100dvh - 230px); min-height: 420px; }

#toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--primary); color: var(--primary-on); padding: 12px 18px; border-radius: 12px; max-width: min(420px, calc(100vw - 40px)); opacity: 0; transform: translateY(8px); transition: .22s; pointer-events: none; z-index: 50; box-shadow: var(--shadow-lg); font-weight: 600; }

  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

</style>

function sanitize(col, input) {
  const value = {};
  for (const f of COLLECTIONS[col].fields) {
    let v = input[f.key];
    if (v === undefined || v === null || v === '') v = f.default ?? '';
    if ((f.type === 'number' || f.type === 'money') && v !== '') {
      v = Number(String(v).replace(/\s/g, '').replace(',', '.'));
      if (!Number.isFinite(v)) return { error: `${f.label}: keine gültige Zahl` };
    } else if (typeof v !== 'number') v = String(v).trim();
    if (f.required && v === '') return { error: `${f.label} ist ein Pflichtfeld` };
    value[f.key] = v;
  }
  return { value };
}

// ======================= Berechnungen =======================

const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const brutto = (b) => round2((Number(b.netto) || 0) * (1 + (Number(b.ustSatz) || 0) / 100));
const ust = (b) => round2(brutto(b) - (Number(b.netto) || 0));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const isOverdue = (r) => r.status === 'offen' && Boolean(r.faellig) && r.faellig < today();
const tageBis = (d) => (d ? Math.round((new Date(`${d}T00:00:00`) - new Date(`${today()}T00:00:00`)) / 86400000) : null);
const MONATLICH = { monatlich: 1, quartalsweise: 1 / 3, halbjährlich: 1 / 6, jährlich: 1 / 12, einmalig: 0 };
const AKTIVE_FAHRZEUGE = () => S.data.fahrzeuge.filter((f) => !['verkauft', 'stillgelegt'].includes(f.status));

function arbeitstage(von, bis) {
  if (!von || !bis || bis < von) return 0;
  const d = new Date(`${von}T00:00:00Z`), end = new Date(`${bis}T00:00:00Z`);
  let n = 0;
  while (d <= end) { const wd = d.getUTCDay(); if (wd && wd !== 6) n++; d.setUTCDate(d.getUTCDate() + 1); }
  return n;
}

function urlaubskonto(m, jahr = new Date().getFullYear()) {
  const s = `${jahr}-01-01`, e = `${jahr}-12-31`;
  let genommen = 0, beantragt = 0;
  for (const a of S.data.abwesenheiten) {
    if (a.mitarbeiterId !== m.id || a.art !== 'Urlaub') continue;
    const t = arbeitstage(a.von < s ? s : a.von, a.bis > e ? e : a.bis);
    if (a.status === 'genehmigt') genommen += t; else if (a.status === 'beantragt') beantragt += t;
  }
  const anspruch = Number(m.urlaubsanspruch) || 0;
  return { anspruch, genommen, beantragt, rest: anspruch - genommen };
}

function ustUebersicht(jahr) {
  const m = Array.from({ length: 12 }, (_, i) => ({ monat: i + 1, umsatzNetto: 0, umsatzsteuer: 0, ausgabenNetto: 0, vorsteuer: 0 }));
  for (const r of S.data.rechnungen) {
    if (r.status === 'storniert' || !String(r.datum).startsWith(jahr)) continue;
    const x = m[Number(r.datum.slice(5, 7)) - 1]; x.umsatzNetto += Number(r.netto) || 0; x.umsatzsteuer += ust(r);
  }
  for (const a of S.data.ausgaben) {
    if (!String(a.datum).startsWith(jahr)) continue;
    const x = m[Number(a.datum.slice(5, 7)) - 1]; x.ausgabenNetto += Number(a.netto) || 0; x.vorsteuer += ust(a);
  }
  return m.map((x) => ({ ...x, umsatzNetto: round2(x.umsatzNetto), umsatzsteuer: round2(x.umsatzsteuer), ausgabenNetto: round2(x.ausgabenNetto), vorsteuer: round2(x.vorsteuer), zahllast: round2(x.umsatzsteuer - x.vorsteuer) }));
}

// Umsatz und Kosten (Belege + Fahrzeugkosten) der letzten n Monate, netto.
function verlauf(n = 6) {
  const out = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const m = new Date(now.getFullYear(), now.getMonth() - i, 1), key = iso(m).slice(0, 7);
    const umsatz = S.data.rechnungen.filter((r) => r.status !== 'storniert' && String(r.datum).startsWith(key)).reduce((s, r) => s + (Number(r.netto) || 0), 0);
    const kosten = S.data.ausgaben.filter((a) => String(a.datum).startsWith(key)).reduce((s, a) => s + (Number(a.netto) || 0), 0)
      + S.data.fahrzeugkosten.filter((k) => String(k.datum).startsWith(key)).reduce((s, k) => s + (Number(k.betrag) || 0), 0);
    out.push({ key, label: m.toLocaleDateString('de-DE', { month: 'short' }).replace('.', ''), umsatz: round2(umsatz), kosten: round2(kosten) });
  }
  return out;
}

function fixkostenMonat() {
  const vertraege = S.data.vertraege.filter((v) => v.status === 'aktiv').reduce((s, v) => s + (Number(v.kosten) || 0) * (MONATLICH[v.intervall] ?? 1), 0);
  const fahrzeuge = AKTIVE_FAHRZEUGE().reduce((s, f) => s + (Number(f.monatsrate) || 0), 0);
  const personal = S.data.mitarbeiter.filter((m) => m.status === 'aktiv').reduce((s, m) => s + (Number(m.bruttogehalt) || 0), 0);
  return { vertraege: round2(vertraege), fahrzeuge: round2(fahrzeuge), personal: round2(personal), summe: round2(vertraege + fahrzeuge + personal) };
}

// Alle anstehenden und überfälligen Termine aus allen Modulen.
function fristen(tage = 60) {
  const grenze = addDays(tage), out = [];
  const add = (datum, titel, modul, ico, page) => { if (datum && datum <= grenze) out.push({ datum, titel, modul, ico, page }); };
  for (const f of AKTIVE_FAHRZEUGE()) {
    add(f.huFaellig, `HU/AU ${f.kennzeichen}`, 'Fuhrpark', 'car', 'fuhrpark');
    add(f.inspektionFaellig, `Inspektion ${f.kennzeichen}`, 'Fuhrpark', 'wrench', 'fuhrpark');
    add(f.uvvFaellig, `UVV-Prüfung ${f.kennzeichen}`, 'Fuhrpark', 'car', 'fuhrpark');
    add(f.vertragsende, `${f.finanzierung === 'Leasing' ? 'Leasingende' : 'Vertragsende'} ${f.kennzeichen}`, 'Fuhrpark', 'car', 'fuhrpark');
  }
  for (const m of S.data.mitarbeiter.filter((x) => x.status === 'aktiv')) add(m.fuehrerscheinkontrolle, `Führerscheinkontrolle ${m.name}`, 'Personal', 'people', 'personal');
  for (const g of S.data.inventar.filter((x) => x.status !== 'ausgemustert')) add(g.pruefungFaellig, `Prüfung ${g.bezeichnung}`, 'Inventar', 'box', 'inventar');
  for (const v of S.data.vertraege.filter((x) => x.status === 'aktiv')) add(v.kuendigenBis, `Kündigungsfrist ${v.titel}`, 'Verträge', 'contract', 'vertraege');
  for (const t of S.data.ausschreibungen.filter((x) => ['neu', 'in Prüfung', 'Angebot in Arbeit'].includes(x.status))) add(t.frist, `Angebotsfrist ${t.titel}`, 'Ausschreibung', 'tender', 'ausschreibungen');
  for (const r of S.data.rechnungen.filter((x) => x.status === 'offen')) add(r.faellig, `Zahlung ${r.nummer}`, 'Forderung', 'receipt', 'finanzen');

let pdfjsPromise;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Der PDF-Leser konnte nicht geladen werden.')); document.head.append(s); }); }
function pdfjs() {
  pdfjsPromise ??= (async () => {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    return window.pdfjsLib;
  })();
  return pdfjsPromise;
}
async function readPdf(file, maxImages) {
  const lib = await pdfjs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  let text = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) {
    const c = await (await pdf.getPage(i)).getTextContent();
    text += `\n--- Seite ${i} ---\n` + c.items.map((it) => it.str).join(' ');
    if (text.length > 180000) break;
  }
  if (text.replace(/--- Seite \d+ ---|\s/g, '').length > 200 || !maxImages) return { text: text.slice(0, 180000), images: [] };
  const images = [];
  for (let i = 1; i <= Math.min(pdf.numPages, maxImages); i++) {
    const page = await pdf.getPage(i), vp = page.getViewport({ scale: 1.6 }), canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    images.push(await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85)));
  }
  return { text: '', images };
}
async function dokumentVorbereiten(file) {
  if (!file) return { text: '', images: [] };
  const s = await ki(), limits = await s.limits().catch(() => null), maxImg = limits && limits.images ? limits.images.maxCount : 0;
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return readPdf(file, Math.min(maxImg, 5));
  if (file.type.startsWith('image/')) { if (!maxImg) throw { code: 'images_unavailable' }; return { text: '', images: [file] }; }
  throw new Error('Bitte ein PDF oder ein Foto (JPG, PNG) wählen.');
}

function markdown(text) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const out = []; let list = null;

  for (const line of String(text).split('\n')) {
    const h = line.match(/^#{1,4}\s+(.*)/), ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { close(); out.push(`<h4>${inline(h[1])}</h4>`); }
    else if (ul || ol) { const t = ul ? 'ul' : 'ol'; if (list !== t) { close(); out.push(`<${t}>`); list = t; } out.push(`<li>${inline((ul || ol)[1])}</li>`); }
    else if (!line.trim()) close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return `<div class="md">${out.join('')}</div>`;
}

          await saveRecord(col, { ...(record || {}), ...value, id: record ? record.id : newId(), ...(record ? { geaendert: new Date().toISOString() } : { erstellt: new Date().toISOString() }) });
          dialog.close(); toast('Gespeichert'); render(true);
        } catch (e) { toast(e.message, true); }
      };
      const del = $('#del', d);
      if (del) del.onclick = async () => {
        if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Endgültig löschen?'; setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = 'Löschen'; } }, 4000); return; }
        try { await deleteRecord(col, record.id); dialog.close(); toast('Gelöscht'); render(true); } catch { toast('Löschen fehlgeschlagen.', true); }
      };
    },
  });
}

async function patch(col, rec, changes) {

function cell(f, r) {
  const v = r[f.key];
  if (f.type === 'money') return euro(v);
  if (f.type === 'number') return zahl(v);
  let main;
  if (f.type === 'date') main = datum(v);
  else if (f.type === 'ref') main = v ? esc(ref(f.ref, v)) : '<span class="sub">–</span>';
  else if (f.key === 'status') main = v ? pill(v) : '';
  else if (f.type === 'select') main = v ? pill(v, 'plain') : '';
  else main = esc(v);
  const sub = f.subKey === 'modellLabel' ? [r.marke, r.modell].filter(Boolean).join(' ') : f.subKey ? r[f.subKey] : '';
  return `${main}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}`;
}

// Säulendiagramm Umsatz vs. Kosten (ein Maßstab für Balken und Achse).
function chartUmsatz(data) {
  const W = 640, H = 230, L = 58, R = 8, T = 12, B = 28;
  const max = Math.max(1, ...data.flatMap((d) => [d.umsatz, d.kosten]));
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  const gw = (W - L - R) / data.length, bw = Math.min(22, gw / 3.2);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Umsatz und Kosten der letzten sechs Monate">
    ${[0, nice / 2, nice].map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${euroK(t)}</text>`).join('')}
    ${data.map((d, i) => { const cx = L + gw * i + gw / 2; return `
      <rect x="${cx - bw - 2}" y="${y(d.umsatz)}" width="${bw}" height="${Math.max(0, y(0) - y(d.umsatz))}" rx="4" fill="var(--brass)"><title>Umsatz ${euro(d.umsatz)}</title></rect>
      <rect x="${cx + 2}" y="${y(d.kosten)}" width="${bw}" height="${Math.max(0, y(0) - y(d.kosten))}" rx="4" fill="var(--chart-2)"><title>Kosten ${euro(d.kosten)}</title></rect>
      <text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`; }).join('')}
  </svg>`;
}

// Horizontale Balken (z. B. Kosten je Fahrzeug).
function barList(items) {
  const max = Math.max(1, ...items.map((i) => i.wert));
  return `<ul class="list">${items.map((i) => `<li><div class="txt"><b>${esc(i.label)}</b><div class="bar"><div style="width:${(i.wert / max) * 100}%"></div></div></div><span style="min-width:100px;text-align:right;font-weight:600">${euro(i.wert)}</span></li>`).join('')}</ul>`;
}

function kiErfassen(col) {
  const c = ERFASSEN[col];
  sheet({ title: c.titel, eyebrow: `${icon('spark')} Mit Claude erfassen`,
    body: `<p class="lead" style="margin-bottom:18px">${esc(c.text)}</p><div class="form">
      <div class="full"><label for="file">Foto oder PDF</label><input type="file" id="file" accept="image/*,application/pdf"></div>
      <div class="full"><label for="text">Zusatzangaben${col === 'ausgaben' ? ' oder Beleg beschreiben' : ''}</label><textarea id="text" placeholder="${esc(c.placeholder)}"></textarea></div></div>`,
    foot: `<button class="btn" data-close>Abbrechen</button><button class="btn primary" id="go">${icon('spark')} Auslesen</button>`,
    onMount: (d) => { $('#go', d).onclick = (e) => mitKi(e.currentTarget, async (signal) => {
      const file = $('#file', d).files[0], hinweis = $('#text', d).value.trim();
      if (!file && !hinweis) throw new Error('Bitte ein Foto/PDF wählen oder Angaben eintragen.');
      const doc = await dokumentVorbereiten(file), s = await ki();
      const r = await s.json(`${GRUNDREGELN}\n${c.prompt}\nHeute ist ${today()}.\n${hinweis ? `Angaben des Nutzers: ${hinweis}\n` : ''}${doc.text ? `DOKUMENTTEXT:\n${doc.text.slice(0, 120000)}\n` : ''}${doc.images.length ? 'Das Dokument ist als Bild angehängt.\n' : ''}\nAntworte NUR mit einem JSON-Objekt dieser Form (bei Werten mit | genau eine der Optionen wählen):\n${c.format}`,
        { images: doc.images.length ? doc.images : undefined, signal, modelTier: 'default', cache: false });
      const preset = {};
      for (const f of COLLECTIONS[col].fields) {
        let v = r && r[f.key];
        if (v === undefined || v === null || v === '') continue;
        if (f.type === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(String(v))) continue;
        if (f.type === 'select' && !f.options.includes(String(v))) continue;
        if (f.type === 'money' || f.type === 'number') { v = parseZahl(v); if (!Number.isFinite(v)) continue; }
        preset[f.key] = v;
      }
      if (col === 'ausgaben' && !preset.datum) preset.datum = today();
      openForm(col, null, preset, (r && r.hinweis) || 'Bitte die übernommenen Angaben prüfen.');
    }); } });
}

function renderChat() {
  const log = $('#log'); if (!log) return;
  if (!UI.chat.length) {
    log.innerHTML = `<div style="margin-top:auto"><span class="ki-tag">${icon('spark')} Vorschläge</span><div class="chips" style="margin-top:12px">${['Welche Rechnungen sollte ich heute anmahnen?', 'Welche Verträge sollte ich kündigen oder neu verhandeln?', 'Lohnt sich bei uns die Umstellung auf E-Fahrzeuge?', 'Wie hoch ist die USt-Zahllast diesen Monat und bis wann ist die Voranmeldung fällig?', 'Welche Ausschreibung sollten wir priorisieren?', 'Was muss ich bei der Einstellung eines Minijobbers beachten?'].map((q) => `<button class="btn" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`;
    log.onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) sendChat(b.dataset.q); };
    return;
  }
  log.onclick = null;
  log.innerHTML = UI.chat.map((m) => (m.role === 'user' ? `<div class="msg u">${esc(m.content)}</div>` : `<div class="msg a">${m.pending ? '<span class="thinking"><span class="spin"></span> Claude denkt nach …</span>' : m.error ? `${pill('Hinweis', 'bad')} ${esc(m.error)}` : markdown(m.content)}</div>`)).join('');
  log.scrollTop = log.scrollHeight;
}

let chatBusy = false;
async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || chatBusy) return;
  chatBusy = true;
  if ($('#q')) $('#q').value = '';
  const history = UI.chat.filter((m) => !m.error && !m.pending).slice(-16).map((m) => ({ role: m.role, content: m.content }));
  UI.chat.push({ role: 'user', content: text });
  const answer = { role: 'assistant', content: '', pending: true };
  UI.chat.push(answer);
  renderChat();
  const rules = `${GRUNDREGELN}\nDu hilfst Geschäftsführung und Mitarbeitenden bei Personal, Finanzen, Steuern, Liquidität, Fuhrpark, Inventar, Verträgen, Ausschreibungen und Organisation. Du kannst keine Daten ändern – sage, in welchem Bereich der App (Personal, Finanzen, Ausschreibungen, Fuhrpark, Inventar, Verträge, Firmenprofil) der Nutzer etwas erledigt. Antworte mit kurzen Absätzen und Aufzählungen.\n\nAKTUELLER LAGEBERICHT DER FIRMA:\n${lagebericht()}`;
  try {
    const s = await ki();
    const { text: t } = await s([{ role: 'user', content: rules }, ...history, { role: 'user', content: text }], {
      cache: false, modelTier: 'default',
      onText: ({ text: part }) => { answer.pending = false; answer.content = part; const last = $('#log .msg.a:last-child'); if (last) { last.innerHTML = markdown(part); $('#log').scrollTop = $('#log').scrollHeight; } },
    });
    answer.content = t; answer.pending = false;
  } catch (e) {
    answer.pending = false;
    if (e && e.text && e.code !== 'refused') answer.content = e.text + '\n\n*(unterbrochen)*';
    else answer.error = kiFehler(e);
  } finally { chatBusy = false; renderChat(); }
}

// ======================= Steuerung =======================

function go(page) {
  UI.page = PAGES[page] ? page : 'uebersicht';
  try { history.replaceState(null, '', `#${UI.page}`); } catch { /* ignorieren */ }
  render();
  window.scrollTo(0, 0);
}

// Live-Aktualisierungen zeichnen nicht neu, solange im Seiteninhalt getippt wird oder der Chat offen ist.
function render(fromData = false) {
  if (fromData) {
    const a = document.activeElement;
    if (a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'search') return;
    if (UI.page === 'assistent') return;
  }
  renderNav();
  PAGES[UI.page]();
}

(async () => {
  await initStore();
  const start = location.hash.replace('#', '');
  go(PAGES[start] ? start : 'uebersicht');
})();
