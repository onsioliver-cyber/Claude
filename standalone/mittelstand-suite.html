<style>
/* Layout: Kontor-Werkbank – feste Navigationsleiste links (Tablet quer) bzw. oben (Hochformat/Phone), Arbeitsfläche rechts. */
:root {
  --bg: #eef2f1;

  --surface-2: #f6f8f7;
  --ink: #15211f;
  --muted: #5d6b68;
  --line: #d8e0de;
  --accent: #0d6b62;
  --accent-ink: #ffffff;
  --accent-soft: #dcefeb;
  --nav: #10302c;
  --nav-ink: #c6dad6;
  --ki: #3d3fb8;
  --ki-soft: #e7e7fb;
  --ok: #157347;
  --ok-soft: #dff3e8;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --bad: #b42318;
  --bad-soft: #fde6e3;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --surface: #141d1c; --surface-2: #192423; --ink: #e3ecea; --muted: #93a5a1; --line: #263533;
    --accent: #45b8a9; --accent-ink: #06201d; --accent-soft: #15332f; --nav: #081110; --nav-ink: #a9c2bd;
    --ki: #9d9ff5; --ki-soft: #23244a; --ok: #5fcf95; --ok-soft: #12301f; --warn: #f0b45c; --warn-soft: #33260f;
    --bad: #f3877c; --bad-soft: #3a1714; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413; --surface: #141d1c; --surface-2: #192423; --ink: #e3ecea; --muted: #93a5a1; --line: #263533;
  --accent: #45b8a9; --accent-ink: #06201d; --accent-soft: #15332f; --nav: #081110; --nav-ink: #a9c2bd;
  --ki: #9d9ff5; --ki-soft: #23244a; --ok: #5fcf95; --ok-soft: #12301f; --warn: #f0b45c; --warn-soft: #33260f;
  --bad: #f3877c; --bad-soft: #3a1714; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav); }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.nav { background: var(--nav); color: var(--nav-ink); padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; padding: 0 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px var(--f-display); }
.brand strong { font: 700 16px/1.2 var(--f-display); display: block; }
.brand small { font-size: 12px; color: var(--nav-ink); display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav button { all: unset; cursor: pointer; padding: 11px 12px; border-radius: 8px; font-weight: 500; display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; }
.nav button:hover { background: rgba(255,255,255,.06); }
.nav button[aria-current="page"] { background: rgba(255,255,255,.12); color: #fff; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .dot { width: 8px; height: 8px; border-radius: 2px; background: currentColor; opacity: .55; }
.nav-foot { margin-top: auto; font-size: 12px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.06); line-height: 1.45; }
main { padding-block: 28px 48px; padding-left: 32px; padding-right: max(16px, env(safe-area-inset-right, 0px), 32px); min-width: 0; }
h1 { font: 700 28px/1.15 var(--f-display); margin: 0 0 4px; letter-spacing: -.01em; text-wrap: balance; }

.lead { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 12px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .k { color: var(--muted); font-size: 13px; }
.kpi .v { font: 500 22px/1.3 var(--f-num); margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .h { color: var(--muted); font-size: 12px; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.toolbar input[type="search"] { width: 220px; max-width: 100%; }
button.btn, .btn { font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 14px; min-height: 42px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ki { background: var(--ki); border-color: var(--ki); color: #fff; }
:root[data-theme="dark"] .btn.ki { color: #10112e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ki { color: #10112e; } }
.btn.sm { padding: 5px 10px; min-height: 36px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .6; cursor: progress; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13.5px; }
td.act { text-align: right; min-width: 190px; }
td.act .btn { margin: 0 0 4px 4px; }
tr:last-child td { border-bottom: none; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ki { background: var(--ki-soft); color: var(--ki); }
.empty { color: var(--muted); padding: 16px 2px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
input, select, textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); min-height: 44px; }
textarea { min-height: 96px; resize: vertical; }
.form { display: grid; gap: 12px 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.form .full { grid-column: 1 / -1; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); background: var(--surface); color: var(--ink); }
dialog.wide { width: min(1040px, calc(100vw - 24px)); }
dialog::backdrop { background: rgba(8, 18, 16, .5); }
.dlg { padding: 22px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.output { white-space: pre-wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 14.5px; max-height: 55vh; overflow: auto; -webkit-user-select: text; user-select: text; }
.thinking { color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; max-width: min(420px, calc(100vw - 32px)); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 20; }
#toast.show { opacity: 1; transform: none; }
#toast.err { background: var(--bad); color: #fff; }
.md p { margin: 0 0 9px; } .md ul, .md ol { margin: 0 0 9px; padding-left: 22px; } .md h4 { margin: 12px 0 6px; font-family: var(--f-display); }
.chat { display: flex; flex-direction: column; height: calc(100dvh - 190px); min-height: 380px; }
.log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
.msg { max-width: min(80%, 70ch); padding: 10px 14px; border-radius: 12px; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); white-space: pre-wrap; }
.msg.a { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
.composer { display: flex; gap: 8px; margin-top: 12px; align-items: flex-end; }
.composer textarea { min-height: 52px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .btn { text-align: left; }
.score { font: 600 30px/1.1 var(--f-num); }
ul.plain { margin: 0; padding-left: 20px; }
.note { font-size: 13px; color: var(--muted); }
.banner { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--ink); padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding-block: 8px; padding-right: max(14px, env(safe-area-inset-right, 0px)); z-index: 5; scrollbar-width: none; }
  .brand { padding: 0 8px 0 0; }
  .brand small, .nav-foot, .nav .dot { display: none; }
  .nav button { white-space: nowrap; padding: 9px 11px; }
  main { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 24px; }
  .chat { height: calc(100dvh - 210px); }
}

<div class="app">
  <nav class="nav" aria-label="Module">
    <div class="brand"><span class="brand-mark">MS</span><div><strong>Mittelstand Suite</strong><small id="firmenname"></small></div></div>
    <button data-page="uebersicht"><span class="dot"></span>Übersicht</button>
    <button data-page="personal"><span class="dot"></span>Personal</button>
    <button data-page="buchhaltung"><span class="dot"></span>Buchhaltung</button>
    <button data-page="ausschreibungen"><span class="dot"></span>Ausschreibungen</button>
    <button data-page="assistent"><span class="dot"></span>KI-Assistent</button>
    <button data-page="firma"><span class="dot"></span>Firmenprofil</button>
    <div class="nav-foot" id="status">Verbinde …</div>
  </nav>

<script>
'use strict';

// ======================= Datenmodell =======================

const COLLECTIONS = {
  mitarbeiter: { singular: 'Mitarbeiter', fields: [
    { key: 'name', label: 'Name', type: 'text', required: true, list: true },
    { key: 'position', label: 'Position', type: 'text', list: true },
    { key: 'abteilung', label: 'Abteilung', type: 'text', list: true },
    { key: 'email', label: 'E-Mail', type: 'email' },
    { key: 'eintritt', label: 'Eintrittsdatum', type: 'date', list: true },
    { key: 'vertragsart', label: 'Vertragsart', type: 'select', options: ['Vollzeit', 'Teilzeit', 'Minijob', 'Auszubildende/r', 'Werkstudent/in'], list: true },
    { key: 'bruttogehalt', label: 'Bruttogehalt / Monat', type: 'money' },
    { key: 'urlaubsanspruch', label: 'Urlaubsanspruch (Tage/Jahr)', type: 'number', default: 30 },
    { key: 'status', label: 'Status', type: 'select', options: ['aktiv', 'ausgeschieden'], default: 'aktiv', list: true },
    { key: 'notizen', label: 'Notizen / Leistungsbeurteilung', type: 'textarea' },
  ] },
  abwesenheiten: { singular: 'Abwesenheit', fields: [
    { key: 'mitarbeiterId', label: 'Mitarbeiter', type: 'ref', ref: 'mitarbeiter', required: true, list: true },
    { key: 'art', label: 'Art', type: 'select', options: ['Urlaub', 'Krankheit', 'Fortbildung', 'Sonderurlaub', 'Sonstiges'], default: 'Urlaub', list: true },
    { key: 'von', label: 'Von', type: 'date', required: true, list: true },
    { key: 'bis', label: 'Bis', type: 'date', required: true, list: true },
    { key: 'status', label: 'Status', type: 'select', options: ['beantragt', 'genehmigt', 'abgelehnt'], default: 'beantragt', list: true },
    { key: 'notiz', label: 'Notiz', type: 'text' },
  ] },
  kunden: { singular: 'Kunde', fields: [
    { key: 'name', label: 'Firma / Name', type: 'text', required: true, list: true },
    { key: 'ansprechpartner', label: 'Ansprechpartner', type: 'text', list: true },
    { key: 'email', label: 'E-Mail', type: 'email', list: true },
    { key: 'telefon', label: 'Telefon', type: 'text' },
    { key: 'adresse', label: 'Adresse', type: 'textarea' },
    { key: 'ustId', label: 'USt-IdNr.', type: 'text' },
  ] },
  rechnungen: { singular: 'Rechnung', fields: [
    { key: 'nummer', label: 'Rechnungsnr.', type: 'text', list: true, placeholder: 'wird automatisch vergeben' },
    { key: 'kundeId', label: 'Kunde', type: 'ref', ref: 'kunden', required: true, list: true },
    { key: 'datum', label: 'Rechnungsdatum', type: 'date', required: true, list: true },
    { key: 'faellig', label: 'Fällig am', type: 'date', list: true },
    { key: 'beschreibung', label: 'Leistung', type: 'textarea' },
    { key: 'netto', label: 'Nettobetrag', type: 'money', required: true, list: true },
    { key: 'ustSatz', label: 'USt-Satz %', type: 'select', options: ['19', '7', '0'], default: '19' },
    { key: 'status', label: 'Status', type: 'select', options: ['offen', 'bezahlt', 'storniert'], default: 'offen', list: true },
  ] },
  ausgaben: { singular: 'Ausgabe', fields: [
    { key: 'datum', label: 'Belegdatum', type: 'date', required: true, list: true },
    { key: 'lieferant', label: 'Lieferant', type: 'text', required: true, list: true },
    { key: 'beschreibung', label: 'Beschreibung', type: 'text', list: true },
    { key: 'netto', label: 'Nettobetrag', type: 'money', required: true, list: true },
    { key: 'ustSatz', label: 'USt-Satz %', type: 'select', options: ['19', '7', '0'], default: '19' },
    { key: 'konto', label: 'Konto (SKR03)', type: 'text', list: true },
    { key: 'kategorie', label: 'Kategorie', type: 'text' },
  ] },
  ausschreibungen: { singular: 'Ausschreibung', fields: [
    { key: 'titel', label: 'Titel', type: 'text', required: true, list: true },
    { key: 'auftraggeber', label: 'Auftraggeber', type: 'text', list: true },
    { key: 'vergabeplattform', label: 'Vergabeplattform / Link', type: 'text' },
    { key: 'frist', label: 'Angebotsfrist', type: 'date', list: true },
    { key: 'volumen', label: 'Geschätztes Volumen (netto)', type: 'money', list: true },
    { key: 'cpv', label: 'CPV-Code', type: 'text' },
    { key: 'status', label: 'Status', type: 'select', options: ['neu', 'in Prüfung', 'Angebot in Arbeit', 'abgegeben', 'gewonnen', 'verloren', 'verworfen'], default: 'neu', list: true },
    { key: 'beschreibung', label: 'Leistungsbeschreibung / Auszug', type: 'textarea' },
  ] },
};

const FIRMA_FIELDS = [
  { key: 'name', label: 'Firmenname', type: 'text' },
  { key: 'rechtsform', label: 'Rechtsform', type: 'text' },
  { key: 'branche', label: 'Branche', type: 'text' },
  { key: 'adresse', label: 'Adresse', type: 'textarea' },
  { key: 'leistungen', label: 'Kernleistungen & Referenzen', type: 'textarea' },
  { key: 'zertifikate', label: 'Zertifikate (ISO, Präqualifikation …)', type: 'textarea' },
  { key: 'jahresumsatz', label: 'Jahresumsatz (netto)', type: 'money' },
  { key: 'ustId', label: 'USt-IdNr.', type: 'text' },
  { key: 'steuernummer', label: 'Steuernummer', type: 'text' },
  { key: 'iban', label: 'IBAN', type: 'text' },
  { key: 'bank', label: 'Bank', type: 'text' },
];

function sanitize(col, input) {
  const value = {};
  for (const f of COLLECTIONS[col].fields) {
    let v = input[f.key];
    if (v === undefined || v === null || v === '') v = f.default ?? '';
    if ((f.type === 'number' || f.type === 'money') && v !== '') {
      v = Number(String(v).replace(/\s/g, '').replace(',', '.'));
      if (!Number.isFinite(v)) return { error: `${f.label}: keine gültige Zahl` };
    } else if (typeof v !== 'number') v = String(v).trim();
    if (f.required && v === '') return { error: `${f.label} ist ein Pflichtfeld` };
    value[f.key] = v;
  }
  return { value };
}

// ======================= Berechnungen =======================

const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const brutto = (b) => round2((Number(b.netto) || 0) * (1 + (Number(b.ustSatz) || 0) / 100));
const ust = (b) => round2(brutto(b) - (Number(b.netto) || 0));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const isOverdue = (r) => r.status === 'offen' && Boolean(r.faellig) && r.faellig < today();
const tageBis = (d) => (d ? Math.round((new Date(`${d}T00:00:00`) - new Date(`${today()}T00:00:00`)) / 86400000) : null);

function arbeitstage(von, bis) {
  if (!von || !bis || bis < von) return 0;
  const d = new Date(`${von}T00:00:00Z`), end = new Date(`${bis}T00:00:00Z`);
  let n = 0;
  while (d <= end) { const wd = d.getUTCDay(); if (wd && wd !== 6) n++; d.setUTCDate(d.getUTCDate() + 1); }
  return n;
}

function urlaubskonto(m, jahr = new Date().getFullYear()) {
  const s = `${jahr}-01-01`, e = `${jahr}-12-31`;
  let genommen = 0, beantragt = 0;
  for (const a of S.data.abwesenheiten) {
    if (a.mitarbeiterId !== m.id || a.art !== 'Urlaub') continue;
    const t = arbeitstage(a.von < s ? s : a.von, a.bis > e ? e : a.bis);
    if (a.status === 'genehmigt') genommen += t; else if (a.status === 'beantragt') beantragt += t;
  }
  const anspruch = Number(m.urlaubsanspruch) || 0;
  return { anspruch, genommen, beantragt, rest: anspruch - genommen };
}

function ustUebersicht(jahr) {
  const m = Array.from({ length: 12 }, (_, i) => ({ monat: i + 1, umsatzNetto: 0, umsatzsteuer: 0, ausgabenNetto: 0, vorsteuer: 0 }));
  for (const r of S.data.rechnungen) {
    if (r.status === 'storniert' || !String(r.datum).startsWith(jahr)) continue;
    const x = m[Number(r.datum.slice(5, 7)) - 1]; x.umsatzNetto += Number(r.netto) || 0; x.umsatzsteuer += ust(r);
  }
  for (const a of S.data.ausgaben) {
    if (!String(a.datum).startsWith(jahr)) continue;
    const x = m[Number(a.datum.slice(5, 7)) - 1]; x.ausgabenNetto += Number(a.netto) || 0; x.vorsteuer += ust(a);
  }
  return m.map((x) => ({ ...x, umsatzNetto: round2(x.umsatzNetto), umsatzsteuer: round2(x.umsatzsteuer), ausgabenNetto: round2(x.ausgabenNetto), vorsteuer: round2(x.vorsteuer), zahllast: round2(x.umsatzsteuer - x.vorsteuer) }));
}

function nextInvoiceNumber(datum) {

}

async function initStore() {
  const db = window.claude && window.claude.use ? await window.claude.use('db').catch(() => null) : null;

    const done = () => { if (--pending === 0) resolve(); };

      let first = true;
      db.collection(col).onSnapshot((snap) => {
        S.data[col] = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
        if (first) { first = false; done(); } else scheduleRender();
      }, (e) => { if (first) { first = false; done(); } if (e.code === 'revoked') toast('Zugriff auf die Daten wurde entzogen.', true); });
    }
    let first = true;
    db.doc('einstellungen/firma').onSnapshot((snap) => {
      S.firma = snap.exists ? { ...snap.data() } : {};
      $('#firmenname').textContent = S.firma.name || '';
      if (first) { first = false; done(); } else scheduleRender();
    }, () => { if (first) { first = false; done(); } });

// PDF lesen: Text extrahieren; bei gescannten PDFs Seiten als Bilder rendern.
let pdfjsPromise;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('PDF-Leser konnte nicht geladen werden.')); document.head.append(s); });
}
function pdfjs() {
  pdfjsPromise ??= (async () => {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    return window.pdfjsLib;
  })();
  return pdfjsPromise;
}
async function readPdf(file, maxImages) {
  const lib = await pdfjs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  let text = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) {
    const page = await pdf.getPage(i);
    const c = await page.getTextContent();
    text += `\n--- Seite ${i} ---\n` + c.items.map((it) => it.str).join(' ');
    if (text.length > 180000) break;
  }
  if (text.replace(/--- Seite \d+ ---|\s/g, '').length > 200 || !maxImages) return { text: text.slice(0, 180000), images: [] };
  const images = [];
  for (let i = 1; i <= Math.min(pdf.numPages, maxImages); i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 1.6 });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    images.push(await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85)));
  }
  return { text: '', images };
}
async function dokumentVorbereiten(file) {
  if (!file) return { text: '', images: [] };
  const s = await ki();
  const limits = await s.limits().catch(() => null);
  const maxImg = limits && limits.images ? limits.images.maxCount : 0;
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return readPdf(file, Math.min(maxImg, 5));
  if (file.type.startsWith('image/')) {
    if (!maxImg) throw { code: 'images_unavailable' };
    return { text: '', images: [file] };
  }
  throw new Error('Bitte ein PDF oder ein Foto (JPG, PNG) wählen.');
}

const pill = (t, cls) => `<span class="pill ${cls || PILL[t] || ''}">${esc(t)}</span>`;

function markdown(text) {
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of String(text).split('\n')) {
    const h = line.match(/^#{1,4}\s+(.*)/), ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { close(); out.push(`<h4>${inline(h[1])}</h4>`); }
    else if (ul || ol) { const t = ul ? 'ul' : 'ol'; if (list !== t) { close(); out.push(`<${t}>`); list = t; } out.push(`<li>${inline((ul || ol)[1])}</li>`); }
    else if (!line.trim()) close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return `<div class="md">${out.join('')}</div>`;
}

  const search = $(`#search-${col}`, el);
  search.oninput = () => { UI.search[col] = search.value; const pos = search.selectionStart; table(el, col, o); const s2 = $(`#search-${col}`, el); s2.focus(); s2.setSelectionRange(pos, pos); };
  $('[data-new]', el).onclick = () => openForm(col, null, o.preset ? o.preset() : {});
  $('[data-csv]', el).onclick = () => speichereDatei(`${col}-${today()}.csv`, csv(col));
  el.onclick = async (e) => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const rec = S.data[col].find((r) => r.id === tr.dataset.id); if (!rec) return;
    const btn = e.target.closest('button'); if (!btn) return;
    if (btn.hasAttribute('data-edit')) openForm(col, rec);
    else if (btn.hasAttribute('data-del')) {
      if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'Wirklich löschen?'; setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'Löschen'; }, 4000); return; }
      try { await deleteRecord(col, rec.id); toast('Gelöscht'); render(true); } catch { toast('Löschen fehlgeschlagen.', true); }
    } else if (btn.dataset.act) o.actions[Number(btn.dataset.act)].run(rec, btn);
  };
}

function tabs(el, page, defs) {

  el.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { UI.tab[page] = Number(b.dataset.tab); render(); }; });

      const ustSatz = ['19', '7', '0'].includes(String(d.ustSatz)) ? String(d.ustSatz) : '19';
      const preset = { datum: /^\d{4}-\d{2}-\d{2}$/.test(d.datum || '') ? d.datum : today(), lieferant: d.lieferant || '', beschreibung: d.beschreibung || '', netto: Number(d.netto) || '', ustSatz, konto: String(d.konto || ''), kategorie: d.kategorie || '' };
      openForm('ausgaben', null, preset, `Vorschlag von Claude: ${d.begruendung || ''}`);
    });
  });
}

function analyseHtml(a) {
  const list = (xs) => (Array.isArray(xs) && xs.length ? `<ul class="plain">${xs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="empty">–</p>');
  return `<div class="kpis">
      <div class="kpi"><div class="k">Empfehlung</div><div class="v">${pill(a.empfehlung || 'Prüfen')}</div></div>
      <div class="kpi"><div class="k">Passung</div><div class="score">${Number(a.passung_score) || 0}/100</div></div>
      <div class="kpi"><div class="k">Angebotsfrist</div><div class="v">${datum(/^\d{4}-\d{2}-\d{2}$/.test(a.frist || '') ? a.frist : '')}</div></div>
      <div class="kpi"><div class="k">Volumen (geschätzt)</div><div class="v">${a.volumen ? euro(a.volumen) : '–'}</div></div>
    </div>
    <p><strong>${esc(a.titel)}</strong> – ${esc(a.auftraggeber)}${a.cpv ? ` · CPV ${esc(a.cpv)}` : ''}</p>
    <p>${esc(a.zusammenfassung)}</p><p><strong>Begründung:</strong> ${esc(a.begruendung)}</p>
    <div class="cols">
      <div><h2>Eignungskriterien</h2>${Array.isArray(a.eignungskriterien) && a.eignungskriterien.length ? `<div class="table-wrap"><table>${a.eignungskriterien.map((k) => `<tr><td>${pill(k.erfuellt || 'unklar')}</td><td>${esc(k.kriterium)}<br><span class="note">${esc(k.kommentar)}</span></td></tr>`).join('')}</table></div>` : '<p class="empty">–</p>'}</div>
      <div><h2>Leistungsumfang</h2>${list(a.leistungsumfang)}<h2 style="margin-top:16px">Zuschlagskriterien</h2>${list(a.zuschlagskriterien)}</div>
      <div><h2>Geforderte Unterlagen</h2>${list(a.geforderte_unterlagen)}</div>
      <div><h2>Risiken</h2>${list(a.risiken)}<h2 style="margin-top:16px">Nächste Schritte</h2>${list(a.naechste_schritte)}</div>
    </div>`;
}

async function analysiereAusschreibung({ text = '', file = null, signal }) {
  const doc = await dokumentVorbereiten(file);
  const s = await ki();
  return s.json(`${GRUNDREGELN}
Du bist erfahrener Bid-Manager für öffentliche Ausschreibungen (GWB, VgV, UVgO, VOB/A) und bewertest Ausschreibungen für mittelständische Bieter.

Analysiere die folgende Ausschreibung und bewerte, ob sich eine Teilnahme für unser Unternehmen lohnt. Prüfe die Eignungskriterien gegen unser Firmenprofil. Heute ist ${today()}.

UNSER FIRMENPROFIL:
${firmaText()}
Aktive Mitarbeiter: ${S.data.mitarbeiter.filter((m) => m.status === 'aktiv').length}

AUSSCHREIBUNG:
${[text, doc.text].filter(Boolean).join('\n\n').slice(0, 200000) || '(siehe Bilder)'}

Antworte NUR mit einem JSON-Objekt dieser Form:
{"titel":"","auftraggeber":"","frist":"JJJJ-MM-TT oder leer","volumen":0,"cpv":"","zusammenfassung":"","leistungsumfang":[""],"eignungskriterien":[{"kriterium":"","erfuellt":"ja|nein|unklar","kommentar":""}],"zuschlagskriterien":[""],"geforderte_unterlagen":[""],"risiken":[""],"passung_score":0,"empfehlung":"Go|No-Go|Prüfen","begruendung":"","naechste_schritte":[""]}`,
  { images: doc.images.length ? doc.images : undefined, signal, modelTier: 'complex', cache: false });
}

function zeigeAnalyse(t) {
  openDialog(`<h2>KI-Analyse: ${esc(t.titel)}</h2>${analyseHtml(t.analyse)}<p class="note">Erstellt am ${esc(new Date(t.analyse.erstellt || Date.now()).toLocaleString('de-DE'))}. Bitte Vergabeunterlagen selbst prüfen.</p>
    <div class="dlg-actions"><button class="btn primary" data-close>Schließen</button></div>`, null, true);
}

function angebotDialog(t) {
  openDialog(`<h2>Angebotsentwurf: ${esc(t.titel)}</h2>
    <p class="lead" style="margin-bottom:14px">Claude schreibt Anschreiben, Unternehmensdarstellung, Ausführungskonzept und eine Checkliste der Unterlagen${t.analyse ? ' – auf Basis der vorhandenen KI-Analyse' : ''}.</p>
    <label for="hinweise">Hinweise (optional)</label><textarea id="hinweise" placeholder="z. B. Projektleitung durch Herrn Weber, Ausführung mit eigenem Personal"></textarea>
    <div class="dlg-actions"><button class="btn" data-close>Abbrechen</button><button class="btn ki" id="go">Entwurf schreiben</button></div>`, (r) => {
    $('#go', r).onclick = () => {
      const h = $('#hinweise', r).value;
      const daten = { ...t }; delete daten.analyse; delete daten.id;
      kiTextDialog(`Angebot ${t.titel}`, `${GRUNDREGELN}\nDu bist Bid-Manager und schreibst überzeugende, formal saubere Angebotsunterlagen für öffentliche Auftraggeber.

Erstelle einen Entwurf für unser Angebot mit dieser Gliederung:
1. Anschreiben an die Vergabestelle
2. Unternehmensdarstellung & Referenzen (aus dem Firmenprofil)
3. Ausführungskonzept (Vorgehen, Projektorganisation, Zeitplan, Qualitätssicherung), zugeschnitten auf die Zuschlagskriterien
4. Checkliste der beizufügenden Unterlagen und Eigenerklärungen
Preise nicht erfinden – Platzhalter verwenden. Reiner Text, Überschriften in GROSSBUCHSTABEN, keine Markdown-Zeichen.

AUSSCHREIBUNG: ${JSON.stringify(daten)}
${t.analyse ? `KI-ANALYSE: ${JSON.stringify(t.analyse)}` : ''}
UNSER FIRMENPROFIL:
${firmaText()}
Hinweise: ${h || '-'}`, { tier: 'complex' });
    };
  });
}

PAGES.ausschreibungen = () => {
  $('#main').innerHTML = head('Ausschreibungen', 'Vergabe-Pipeline mit Fristen, KI-Prüfung von Vergabeunterlagen (Go/No-Go) und Angebotsentwürfe.');
  tabs($('#page'), 'ausschreibungen', [
    { label: 'Pipeline', render: (el) => table(el, 'ausschreibungen', {
      sort: (a, b) => String(a.frist || '9999').localeCompare(String(b.frist || '9999')),
      empty: 'Noch keine Ausschreibungen. Legen Sie eine an oder lassen Sie Unterlagen unter „Unterlagen prüfen“ von der KI auswerten.',
      extra: [
        { label: 'Restzeit', render: (t) => { const n = tageBis(t.frist); return n == null ? '' : n < 0 ? '<span class="note">abgelaufen</span>' : n <= 7 ? pill(`${n} Tage`, 'bad') : `${n} Tage`; } },
        { label: 'KI', render: (t) => (t.analyse ? `${pill(t.analyse.empfehlung || 'Prüfen')} <span class="note">${Number(t.analyse.passung_score) || 0}/100</span>` : '') },
      ],
      actions: [
        { label: 'Analyse ansehen', show: (t) => Boolean(t.analyse), run: zeigeAnalyse },
        { label: 'KI-Prüfung', ki: true, run: (t, btn) => mitKi(btn, async (signal) => {
          const daten = { ...t }; delete daten.analyse; delete daten.id;
          const analyse = await analysiereAusschreibung({ text: JSON.stringify(daten), signal });
          const neu = { ...t, analyse: { ...analyse, erstellt: new Date().toISOString() } };
          await saveRecord('ausschreibungen', neu);
          render(true); zeigeAnalyse(neu);
        }) },
        { label: 'Angebot (KI)', ki: true, run: angebotDialog },
      ],
    }) },
    { label: 'Unterlagen prüfen (KI)', render: (el) => {
      el.innerHTML = `<div class="panel"><h2>Vergabeunterlagen mit KI prüfen</h2>
        <p class="lead" style="margin-bottom:14px">Wählen Sie die Bekanntmachung oder Leistungsbeschreibung als PDF (oder Foto) bzw. fügen Sie den Text ein. Claude extrahiert die Eckdaten, prüft die Eignung gegen Ihr Firmenprofil und gibt eine Go/No-Go-Empfehlung.</p>
        <div class="form">
          <div class="full"><label for="afile">PDF oder Foto</label><input type="file" id="afile" accept="application/pdf,image/*"></div>
          <div class="full"><label for="atext">oder Text der Bekanntmachung</label><textarea id="atext" style="min-height:150px"></textarea></div>
        </div>
        <div class="dlg-actions"><button class="btn ki" id="go">Analysieren</button></div></div><div id="result" style="margin-top:16px"></div>`;
      $('#go', el).onclick = (e) => mitKi(e.currentTarget, async (signal) => {
        const file = $('#afile', el).files[0], text = $('#atext', el).value.trim();
        if (!file && !text) throw new Error('Bitte ein PDF/Foto wählen oder Text einfügen.');
        const a = await analysiereAusschreibung({ text, file, signal });
        $('#result', el).innerHTML = `<div class="panel">${analyseHtml(a)}<div class="dlg-actions"><button class="btn primary" id="take">In Pipeline übernehmen</button></div></div>`;
        $('#take', el).onclick = async () => {
          try {
            await saveRecord('ausschreibungen', { id: newId(), titel: a.titel || 'Ausschreibung', auftraggeber: a.auftraggeber || '', vergabeplattform: '', frist: /^\d{4}-\d{2}-\d{2}$/.test(a.frist || '') ? a.frist : '', volumen: Number(a.volumen) || '', cpv: a.cpv || '', status: 'in Prüfung', beschreibung: a.zusammenfassung || '', analyse: { ...a, erstellt: new Date().toISOString() }, erstellt: new Date().toISOString() });
            toast('In die Pipeline übernommen'); UI.tab.ausschreibungen = 0; render();
          } catch (err) { toast(err.message, true); }
        };
      });
    } },
  ]);
};

PAGES.assistent = () => {
  $('#main').innerHTML = head('KI-Assistent', 'Fragen Sie alles zu Ihrem Unternehmen. Claude kennt Ihre aktuellen Zahlen, Mitarbeiter und Fristen.');
  $('#page').innerHTML = `<div class="panel chat"><div class="log" id="log"></div>
    <form class="composer" id="cf"><textarea id="q" placeholder="Frage stellen …" aria-label="Frage"></textarea><button class="btn primary" id="send">Senden</button></form></div>`;
  renderChat();
  $('#cf').onsubmit = (e) => { e.preventDefault(); sendChat($('#q').value); };
  $('#q').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat($('#q').value); } };
};

function renderChat() {
  const log = $('#log'); if (!log) return;
  if (!UI.chat.length) {
    log.innerHTML = `<div class="chips">${['Welche Rechnungen sollte ich heute anmahnen?', 'Wie hoch ist unsere USt-Zahllast diesen Monat, und bis wann ist die Voranmeldung fällig?', 'Wer hat noch viel Resturlaub?', 'Welche Ausschreibung sollten wir priorisieren?', 'Was muss ich bei der Einstellung eines Minijobbers beachten?'].map((q) => `<button class="btn" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
    log.onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) sendChat(b.dataset.q); };
    return;
  }
  log.innerHTML = UI.chat.map((m) => (m.role === 'user' ? `<div class="msg u">${esc(m.content)}</div>` : `<div class="msg a">${m.pending ? '<span class="thinking"><span class="spin"></span> Claude denkt nach …</span>' : m.error ? `${pill('Fehler', 'bad')} ${esc(m.error)}` : markdown(m.content)}</div>`)).join('');
  log.scrollTop = log.scrollHeight;
}

let chatBusy = false;
async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || chatBusy) return;
  chatBusy = true;
  if ($('#q')) $('#q').value = '';
  const history = UI.chat.filter((m) => !m.error && !m.pending).slice(-16).map((m) => ({ role: m.role, content: m.content }));
  UI.chat.push({ role: 'user', content: text });
  const answer = { role: 'assistant', content: '', pending: true };
  UI.chat.push(answer);
  renderChat();
  const rules = `${GRUNDREGELN}\nDu hilfst Geschäftsführung und Mitarbeitenden bei Personal, Buchhaltung, Steuern, Liquidität, Vertrieb, Ausschreibungen und Organisation. Du kannst keine Daten ändern – sage, in welchem Modul (Personal, Buchhaltung, Ausschreibungen, Firmenprofil) der Nutzer etwas erledigt. Antworte mit kurzen Absätzen und Aufzählungen.\n\nAKTUELLER LAGEBERICHT DER FIRMA:\n${lagebericht()}`;
  try {
    const s = await ki();
    const { text: t } = await s([{ role: 'user', content: rules }, ...history, { role: 'user', content: text }], {
      cache: false, modelTier: 'default',
      onText: ({ text: part }) => { answer.pending = false; answer.content = part; const last = $('#log .msg.a:last-child'); if (last) { last.innerHTML = markdown(part); $('#log').scrollTop = $('#log').scrollHeight; } },
    });
    answer.content = t; answer.pending = false;
  } catch (e) {
    answer.pending = false;
    if (e && e.text && e.code !== 'refused') answer.content = e.text + '\n\n*(unterbrochen)*';
    else answer.error = kiFehler(e);
  } finally { chatBusy = false; renderChat(); }
}

PAGES.firma = () => {
  $('#main').innerHTML = head('Firmenprofil', 'Diese Angaben nutzt Claude für Angebote, Stellenanzeigen, Mahnungen, Rechnungen und die Eignungsprüfung bei Ausschreibungen.');
  $('#page').innerHTML = `<div class="panel"><form class="form" id="ff">${FIRMA_FIELDS.map((f) => fieldInput(f, S.firma[f.key])).join('')}</form>
    <div class="dlg-actions"><button class="btn primary" id="fsave">Speichern</button></div></div>`;
  $('#fsave').onclick = async () => {
    const f = Object.fromEntries(new FormData($('#ff')).entries());
    if (f.jahresumsatz) f.jahresumsatz = Number(String(f.jahresumsatz).replace(',', '.')) || '';
    try { await saveFirma(f); $('#firmenname').textContent = f.name || ''; toast('Firmenprofil gespeichert'); }
    catch { toast('Speichern fehlgeschlagen.', true); }
  };
};

// ======================= Navigation =======================

function go(page) {
  UI.page = PAGES[page] ? page : 'uebersicht';
  try { history.replaceState(null, '', `#${UI.page}`); } catch { /* ignorieren */ }
  render();
  window.scrollTo(0, 0);
}

// Bei Live-Aktualisierungen nicht neu zeichnen, solange der Nutzer in einem Feld der Seite tippt.
function render(fromData = false) {
  if (fromData) {
    const a = document.activeElement;
    if (a && $('#main').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'search') return;
    if (UI.page === 'assistent') return;
  }
  document.querySelectorAll('.nav [data-page]').forEach((b) => { if (b.dataset.page === UI.page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  PAGES[UI.page]();
}

document.querySelector('.nav').addEventListener('click', (e) => { const b = e.target.closest('[data-page]'); if (b) go(b.dataset.page); });

(async () => {
  await initStore();
  $('#firmenname').textContent = S.firma.name || '';
  const start = location.hash.replace('#', '');
  go(PAGES[start] ? start : 'uebersicht');
})();
</script>
